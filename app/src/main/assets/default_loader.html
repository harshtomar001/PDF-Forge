<!DOCTYPE html>

<html><head><style>
    body{margin:0;color:transparent;display:flex;flex-direction:column;align-items:center;justify-content:center;height:100vh;background:transparent;font-family:sans-serif}
    .ring{position:relative;width:72px;height:72px}
    svg{position:absolute;top:0;left:0;animation:spin 1.1s linear infinite}
    @keyframes spin{to{transform:rotate(360deg)}}
    .icon{position:absolute;top:0;left:0;width:72px;height:72px;display:flex;align-items:center;justify-content:center;color:#534AB7;font-size:26px;font-weight:bold}
    .label{margin-top:14px;color:#fff;font-size:14px;font-weight:500}
</style></head>
<body>
<div class="ring">
    <svg width="72" height="72" viewBox="0 0 96 96">
        <circle cx="48" cy="48" r="40" fill="none" stroke="#EEEDFE55" stroke-width="6"/>
        <circle cx="48" cy="48" r="40" fill="none" stroke="%%COLOR%%" stroke-width="6" stroke-linecap="round" stroke-dasharray="70 180"/>
    </svg>
    <div class="icon">i</div>
</div>
<div class="label" id="label">%%LABEL%%</div>
</body></html>
