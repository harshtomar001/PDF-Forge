<div
        style="display:flex;align-items:center;justify-content:center;width:100%;padding:40px 0;height:100%;overflow:hidden" >
<canvas id="c" width="480" height="480" style="width:240px;height:240px"></canvas>
</div>
<script>
var cv=document.getElementById('c');
var ctx=cv.getContext('2d');
var CX = 240, CY = 240, R = 120, RW = 14;

var PW = 78, PH = 100;
var PX = CX - PW / 2;
var PY = CY - PH / 2;
var angle=0,speed=0.055;
var LINE_X1 = 14;
var LINE_MAXES = [68,64,58,66,54,67,60];
var LINE_Y = [38,51,64,77,90,0,0];
var wLines=0,lProg=0,frame=0,pageNum=1;
var WRITE=120,FLIP_DUR=26,flip=null;
var raf=null;
var mode='running';
var finishT=0,checkProg=0,ringProg=0;

function rr(x,y,w,h,r){
  ctx.beginPath();
  ctx.moveTo(x+r,y);ctx.lineTo(x+w-r,y);ctx.quadraticCurveTo(x+w,y,x+w,y+r);
  ctx.lineTo(x+w,y+h-r);ctx.quadraticCurveTo(x+w,y+h,x+w-r,y+h);
  ctx.lineTo(x+r,y+h);ctx.quadraticCurveTo(x,y+h,x,y+h-r);
  ctx.lineTo(x,y+r);ctx.quadraticCurveTo(x,y,x+r,y);
  ctx.closePath();
}
function easeOut(t){return 1-Math.pow(1-t,3);}
function lerp(a,b,t){return a+(b-a)*t;}

function drawRing(){
  ctx.beginPath();ctx.arc(CX,CY,R,0,Math.PI*2);

  ctx.strokeStyle='rgba(255,255,255,0.7)';//  ring bg color

  ctx.lineWidth=RW;ctx.stroke();

  var s=angle-Math.PI/2-1.2,e=angle-Math.PI/2;
  ctx.save();
  ctx.beginPath();ctx.arc(CX,CY,R,angle-Math.PI/2-2.4,e);
  ctx.strokeStyle='rgba(232,25,44,0.13)';ctx.lineWidth=RW+6;ctx.lineCap='round';ctx.stroke();
  ctx.restore();

  var gx1=CX+R*Math.cos(s),gy1=CY+R*Math.sin(s);
  var gx2=CX+R*Math.cos(e),gy2=CY+R*Math.sin(e);
  var lg=ctx.createLinearGradient(gx1,gy1,gx2,gy2);
  lg.addColorStop(0,'rgba(232,25,44,0.0)');
  lg.addColorStop(0.5,'rgba(232,25,44,0.55)');
  lg.addColorStop(1,'#E8192C');
  ctx.save();
  ctx.beginPath();ctx.arc(CX,CY,R,s,e);
  ctx.strokeStyle=lg;ctx.lineWidth=RW;ctx.lineCap='round';ctx.stroke();
  ctx.restore();

  var hx=CX+R*Math.cos(e),hy=CY+R*Math.sin(e);
  ctx.beginPath();ctx.arc(hx,hy,RW*1.1,0,Math.PI*2);
  ctx.fillStyle='rgba(232,25,44,0.22)';ctx.fill();
  ctx.beginPath();ctx.arc(hx,hy,RW*0.52,0,Math.PI*2);
  ctx.fillStyle='#ff3d52';ctx.fill();
  ctx.beginPath();ctx.arc(hx-2,hy-2,RW*0.18,0,Math.PI*2);
  ctx.fillStyle='rgba(255,255,255,0.6)';ctx.fill();
}

function drawFinishRing(){
  ctx.beginPath();ctx.arc(CX,CY,R,0,Math.PI*2);
  ctx.strokeStyle='rgba(0,0,0,0.08)';ctx.lineWidth=RW;ctx.stroke();
  var prog=Math.min(ringProg,1);
  if(prog>0){
    ctx.save();
    ctx.beginPath();ctx.arc(CX,CY,R,-Math.PI/2,-Math.PI/2+Math.PI*2*prog);
    var gs=ctx.createLinearGradient(CX-R,CY,CX+R,CY);
    gs.addColorStop(0,'#1D9E75');gs.addColorStop(1,'#2ECC9A');
    ctx.strokeStyle=gs;ctx.lineWidth=RW;ctx.lineCap='round';ctx.stroke();
    ctx.restore();
  }
  if(ringProg<1) ringProg+=0.022;
}

function drawPageLogo(ox,oy){
  ctx.fillStyle='rgba(232,25,44,0.15)';
  rr(ox+9,oy+6,PW-18,22,5);ctx.fill();
  ctx.save();
  ctx.fillStyle='#E8192C';
  ctx.font='800 15px -apple-system,sans-serif';
  ctx.textAlign='center';ctx.textBaseline='middle';
  ctx.fillText('PDF',ox+PW/2,oy+17);
  ctx.restore();
}

function drawStackPage(ox,oy,alpha){
  ctx.save();ctx.globalAlpha=alpha;
  ctx.fillStyle='#cccccc';rr(PX+ox,PY+oy,PW,PH,9);ctx.fill();
  ctx.restore();
}

function drawPage(x,y,sx,sy,wl,lp,pn){
  ctx.save();
  ctx.translate(x+PW/2,y+PH/2);ctx.scale(sx,sy);ctx.translate(-PW/2,-PH/2);
  rr(0,0,PW,PH,9);ctx.clip();
  ctx.fillStyle='#ffffff';rr(0,0,PW,PH,9);ctx.fill();
  ctx.fillStyle='rgba(232,25,44,0.10)';ctx.fillRect(0,0,PW,34);
  ctx.beginPath();ctx.moveTo(PW-16,0);ctx.lineTo(PW,0);ctx.lineTo(PW,16);ctx.closePath();
  ctx.fillStyle='rgba(232,25,44,0.35)';ctx.fill();
  ctx.strokeStyle='rgba(232,25,44,0.15)';ctx.lineWidth=1;
  ctx.beginPath();ctx.moveTo(0,34);ctx.lineTo(PW,34);ctx.stroke();
  drawPageLogo(0,0);
  ctx.lineCap='round';ctx.lineWidth=2.5;
  for(var i=0;i<5;i++){
    if(i<wl){
      ctx.beginPath();ctx.moveTo(LINE_X1,LINE_Y[i]);ctx.lineTo(LINE_MAXES[i],LINE_Y[i]);
      ctx.strokeStyle='#d0d0cc';ctx.stroke();
    } else if(i===wl){
      var x2=LINE_X1+(LINE_MAXES[i]-LINE_X1)*lp;
      ctx.beginPath();ctx.moveTo(LINE_X1,LINE_Y[i]);ctx.lineTo(x2,LINE_Y[i]);
      ctx.strokeStyle='#d0d0cc';ctx.stroke();
    }
  }
  if(pn>0){
    ctx.fillStyle='#bbb';ctx.font='400 11px sans-serif';
    ctx.textAlign='right';ctx.textBaseline='bottom';
    ctx.fillText('p.'+pn,PW-9,PH-7);
  }
  ctx.restore();
}

function drawPencil(tx,ty){
  ctx.save();ctx.translate(tx,ty);ctx.rotate(-0.65);
  ctx.fillStyle='#b0ada6';ctx.fillRect(-4,-38,8,5);
  ctx.fillStyle='#9e9b94';ctx.fillRect(-4,-33,8,4);
  ctx.fillStyle='#FAC775';ctx.fillRect(-4,-29,8,22);
  ctx.fillStyle='#e8d5a0';ctx.fillRect(-4,-7,8,7);
  ctx.beginPath();ctx.moveTo(-4,0);ctx.lineTo(4,0);ctx.lineTo(0,11);ctx.closePath();
  ctx.fillStyle='#EF9F27';ctx.fill();
  ctx.beginPath();ctx.moveTo(-2,8);ctx.lineTo(2,8);ctx.lineTo(0,11);ctx.closePath();
  ctx.fillStyle='#333';ctx.fill();
  ctx.restore();
}

function drawSuccess(){
  var cx2=PX+PW/2,cy2=PY+PH/2;
  var circR=easeOut(Math.min(finishT/28,1))*70;
  ctx.beginPath();ctx.arc(cx2,cy2,circR,0,Math.PI*2);
  ctx.fillStyle='rgba(29,158,117,0.15)';ctx.fill();
  ctx.strokeStyle='#1D9E75';ctx.lineWidth=2.5;ctx.stroke();
  if(finishT>16){
    checkProg=Math.min(checkProg+0.05,1);
    var pts=[[cx2-24,cy2+4],[cx2-4,cy2+26],[cx2+30,cy2-24]];
    ctx.beginPath();ctx.moveTo(pts[0][0],pts[0][1]);
    for(var seg=0;seg<2;seg++){
      var sp=Math.max(0,Math.min(1,checkProg*2-seg));
      ctx.lineTo(lerp(pts[seg][0],pts[seg+1][0],sp),lerp(pts[seg][1],pts[seg+1][1],sp));
    }
    ctx.strokeStyle='#1D9E75';ctx.lineWidth=6;ctx.lineCap='round';ctx.lineJoin='round';ctx.stroke();
  }
  if(finishT>32){
    var sp2=Math.min((finishT-32)/20,1);
    [[PX+18,PY+18],[PX+PW-18,PY+18],[PX+PW-18,PY+PH-18],[PX+18,PY+PH-18]].forEach(function(s,i){
      var ang=(i*Math.PI/2)-Math.PI/4;
      ctx.beginPath();
      ctx.arc(s[0]+Math.cos(ang)*sp2*24,s[1]+Math.sin(ang)*sp2*24,5*(1-sp2),0,Math.PI*2);
      ctx.fillStyle='#2ECC9A';ctx.globalAlpha=1-sp2;ctx.fill();ctx.globalAlpha=1;
    });
  }
  finishT++;
}

function completeAnim(){
  mode='completing';
  finishT=0;checkProg=0;ringProg=0;
}

function loop(){
  ctx.clearRect(0,0,480,480);

  if(mode === 'completing'){
    drawFinishRing();
    drawStackPage(9,9,0.12);
    drawStackPage(4,4,0.20);
    drawPage(PX,PY,1,1,5,1,pageNum);
    drawSuccess();
    raf = requestAnimationFrame(loop);
    return;
  }

  angle += speed;

  drawRing();
  drawStackPage(9,9,0.12);
  drawStackPage(4,4,0.20);

  var ct = frame % WRITE;
  var writeLimit = WRITE * 0.72;

  if(!flip){
    if(ct < writeLimit){
      var lp2 = (ct / writeLimit) * 5;

      wLines = Math.min(Math.floor(lp2), 4);
      lProg = lp2 % 1;

      if(lp2 >= 5){
        wLines = 4;
        lProg = 1;
      }
    } else {
      wLines = 4;
      lProg = 1;
    }
  }

  if(!flip && ct === Math.floor(writeLimit)){
    pageNum++;
    flip = {t:0, from:pageNum};
  }

 if(flip){
  var fp = flip.t / FLIP_DUR;

  if(fp < 0.5){
    var sx = 1 - (fp / 0.5) * 0.96;
    drawPage(PX, PY, sx, 1 + fp * 0.07, 5, 1, flip.from);
  } else {
    var sx2 = easeOut((fp - 0.5) / 0.5);
    drawPage(PX, PY, sx2, 1 + (1 - fp) * 0.07, 0, 0, flip.from + 1);
  }

  flip.t++;

  if(flip.t >= FLIP_DUR){
    flip = null;
    wLines = 0;
    lProg = 0;
    frame = 0; // important: restart writing cycle after flip
  }

} else {
  drawPage(PX, PY, 1, 1, wLines, lProg, pageNum);

  if(wLines < 5 && ct < writeLimit){
    var tipX = PX + LINE_X1 + (LINE_MAXES[wLines] - LINE_X1) * lProg;
    var tipY = PY + LINE_Y[wLines] - 4;

    if(tipX < PX + PW - 10 && tipY < PY + PH - 10){
      drawPencil(tipX, tipY);
    }
  }
}

  frame++;
  raf = requestAnimationFrame(loop);
}

loop();
</script>
